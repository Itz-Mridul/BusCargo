services:
  - type: web
    name: buscargo-api
    runtime: node
    region: singapore  # Closest to India
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        sync: false   # You will fill this in the Render dashboard
      - key: JWT_SECRET
        sync: false   # You will fill this in the Render dashboard
      - key: CORS_ORIGINS
        sync: false   # Set to your Vercel URL e.g. https://buscargo.vercel.app
    healthCheckPath: /api/cities
